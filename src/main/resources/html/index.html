<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte du Maroc</title>
    <link rel="stylesheet" href="openlayers/ol.css">
    <script src="openlayers/ol.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Éviter les barres de défilement */
        }

        .map {
            width: 100%; /* Prendre toute la largeur de la fenêtre */
            height: 100vh; /* Prendre toute la hauteur de la fenêtre */
        }
    </style>
</head>
<body>
<div id="map" class="map"></div>

<script>
    // Initialisation de la carte OpenLayers
    var map = new ol.Map({
        target: 'map',
        layers: [
            new ol.layer.Tile({
                source: new ol.source.OSM()
            })
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([-7.1, 31.9]), // Coordonnées du Maroc
            zoom: 5
        })
    });

function drawRouteOnMap(apiRouteCoordinates) {
    // Supprimer les couches d'itinéraires existantes
    const existingRouteLayers = map.getLayers().getArray().filter(layer => layer.get('name') === 'routeLayer');
    existingRouteLayers.forEach(layer => map.removeLayer(layer));

    // Convertir les coordonnées [latitude, longitude] en [longitude, latitude] pour OpenLayers
    var convertedCoordinates = apiRouteCoordinates.map(coord => ol.proj.fromLonLat([coord[1], coord[0]]));

    // Créer une géométrie de type ligne
    var routeLine = new ol.geom.LineString(convertedCoordinates);

    // Créer une source de vecteur pour la ligne
    var vectorSource = new ol.source.Vector({
        features: [new ol.Feature({ geometry: routeLine })]
    });

    // Définir le style de la ligne
    var routeStyle = new ol.style.Style({
        stroke: new ol.style.Stroke({
            color: 'blue', // Couleur de l'itinéraire
            width: 4       // Épaisseur de la ligne
        })
    });

    // Créer une couche pour afficher la ligne
    var routeLayer = new ol.layer.Vector({
        source: vectorSource,
        style: routeStyle
    });

    // Attribuer un nom pour identifier la couche plus tard
    routeLayer.set('name', 'routeLayer');

    // Ajouter la couche d'itinéraire à la carte
    map.addLayer(routeLayer);

    // Recentrer la vue sur l'itinéraire
    var routeExtent = routeLine.getExtent();
    map.getView().fit(routeExtent, { padding: [50, 50, 50, 50], maxZoom: 14 });

    console.log("Itinéraire tracé avec succès.");}



function addMarker(latitude, longitude) {
 // Supprimer les couches de marqueurs existantes
    const existingLayers = map.getLayers().getArray().filter(layer => layer instanceof ol.layer.Vector);
    existingLayers.forEach(layer => map.removeLayer(layer));
    if (latitude == null || longitude == null || isNaN(latitude) || isNaN(longitude)) {
        console.error("Latitude ou longitude non définie pour addMarker");
        return;
    }
    console.log("Ajout d'un marqueur aux coordonnées : ", latitude, longitude);
    var coords = ol.proj.fromLonLat([longitude, latitude]);

    var marker = new ol.Feature({
        geometry: new ol.geom.Point(coords)
    });

    var iconStyle = new ol.style.Style({
        image: new ol.style.Icon({
            anchor: [0.5, 1],
            src: '../images/marker.png',
            scale: 0.1
        })
    });
    marker.setStyle(iconStyle);

    var vectorSource = new ol.source.Vector({
        features: [marker]
    });

    var markerLayer = new ol.layer.Vector({
        source: vectorSource
    });

    map.addLayer(markerLayer);
    map.getView().setCenter(coords);
    map.getView().setZoom(12);


}


var markersArray = [];

// Fonction pour mettre à jour la carte avec plusieurs marqueurs
function updateMap(locations) {
    // Supprimer les couches de marqueurs existantes
    const existingLayers = map.getLayers().getArray().filter(layer => layer instanceof ol.layer.Vector);
    existingLayers.forEach(layer => map.removeLayer(layer));

    // Réinitialiser le tableau des marqueurs
    markersArray = [];

    // Ajouter chaque location à la carte
    locations.forEach(function(location) {
        // Convertir les coordonnées pour OpenLayers
        var coords = ol.proj.fromLonLat([location.lng, location.lat]);
        var marker = new ol.Feature({
            geometry: new ol.geom.Point(coords),
            name: location.name
        });

        // Créer un Canvas pour dessiner un point rouge
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var size = 32; // Taille de l'icône
        canvas.width = size;
        canvas.height = size;

        // Dessiner l'icône principale du marqueur (image)
        var img = new Image();
        img.src = '../images/marker.png'; // Icône principale du marqueur
        img.onload = function() {
            ctx.drawImage(img, 0, 0, size, size);

            // Ajouter un cercle rouge en bas de l'icône
            ctx.beginPath();
            ctx.arc(size / 2, size - 5, 5, 0, Math.PI * 2, false); // Cercle rouge
            ctx.fillStyle = 'red';
            ctx.fill();

            // Créer un style avec le Canvas
            var iconStyle = new ol.style.Style({
                image: new ol.style.Icon({
                    anchor: [0.5, 1],
                    img: canvas, // Utiliser le Canvas comme image
                    imgSize: [size, size] // Taille de l'icône
                })
            });

            // Appliquer le style au marqueur
            marker.setStyle(iconStyle);

            // Source et couche de vecteur pour le marqueur
            var vectorSource = new ol.source.Vector({
                features: [marker]
            });
            var markerLayer = new ol.layer.Vector({
                source: vectorSource
            });

            // Ajouter la couche de marqueur à la carte
            map.addLayer(markerLayer);
        };

        // Ajouter les coordonnées de la location dans le tableau markersArray
        markersArray.push({ lat: location.lat, lng: location.lng });
    });

    // Recentrer la carte sur le premier marqueur s'il y en a
    if (locations.length > 0) {
        var firstCoords = ol.proj.fromLonLat([locations[0].lng, locations[0].lat]);
        map.getView().setCenter(firstCoords);
        map.getView().setZoom(12);
    }

    // Afficher le contenu du tableau dans la console
    console.log("Coordonnées des marqueurs ajoutées : ", markersArray);

    // Vérification de l'état du tableau
    if (markersArray.length === 0) {
        console.log("Le tableau des marqueurs est vide.");
    } else {
        console.log("Le tableau des marqueurs contient : ", markersArray.length, " éléments.");
    }
}


// Fonction qui retourne les coordonnées du premier marqueur
function getFirstMarkerCoordinates() {
    if (markersArray.length > 0) {
        return markersArray[0];
    } else {
        return null;
    }
}

    // Fonction pour mettre à jour la carte avec les marqueurs des restaurants
function updateMapWithRestaurants(restaurants) {
    // Supprimer toutes les couches de type Vector existantes
    const existingLayers = map.getLayers().getArray().filter(layer => layer instanceof ol.layer.Vector);
    existingLayers.forEach(layer => map.removeLayer(layer));

    // Ajouter un marqueur pour chaque restaurant
    restaurants.forEach(function(restaurant) {
        // Coordonner de chaque restaurant (latitude et longitude)
        var coords = ol.proj.fromLonLat([restaurant.lng, restaurant.lat]);

        // Créer le marqueur avec son nom
        var marker = new ol.Feature({
            geometry: new ol.geom.Point(coords),
            name: restaurant.name // Nom du restaurant pour une éventuelle info-bulle
        });

        // Définir l'icône du marqueur
        var iconStyle = new ol.style.Style({
            image: new ol.style.Icon({
                anchor: [0.5, 1],
                src: '../images/hotell.png', // Assurez-vous que l'image du marqueur existe
                scale: 0.1
            })
        });
        marker.setStyle(iconStyle);

        // Ajouter le marqueur dans une source de vecteur
        var vectorSource = new ol.source.Vector({
            features: [marker]
        });

        // Créer une couche de vecteur pour le marqueur
        var markerLayer = new ol.layer.Vector({
            source: vectorSource
        });

        // Ajouter la couche de marqueur à la carte
        map.addLayer(markerLayer);
    });

    // Si des restaurants sont présents, recentrer la carte sur le premier restaurant
    if (restaurants.length > 0) {
        var firstCoords = ol.proj.fromLonLat([restaurants[0].lng, restaurants[0].lat]);
        map.getView().setCenter(firstCoords);
        map.getView().setZoom(12);
    }
}
