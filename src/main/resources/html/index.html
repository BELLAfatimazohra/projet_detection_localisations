<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte du Maroc</title>
    <link rel="stylesheet" href="openlayers/ol.css">
    <script src="openlayers/ol.js"></script>
    <style>
        body {
            margin: 0;
            display: flex; /* Utiliser Flexbox pour un alignement horizontal */
        }
        .map {
            width: 70%; /* Largeur de la carte */
            height: 100vh;
        }
        .sidebar {
            width:
30%; /* Largeur de la barre latérale */
            height: 100vh;
            background-color: #f4f4f4; /* Couleur de fond de la barre latérale */
            padding: 10px; /* Espacement interne */
            overflow-y: auto; /* Défilement si le contenu dépasse */
        }
        #searchField {
            width: 100%; /* Largeur du champ de recherche */
        }
    </style>
</head>
<body>
<div id="map" class="map"></div>
<div class="sidebar">
    <ul id="suggestionsList" style="list-style-type: none; padding: 0;"></ul>
    <h2 id="locationNameLabel"></h2>
    <p id="locationDescriptionLabel"></p>
</div>

<script>
    // Initialisation de la carte OpenLayers
    var map = new ol.Map({
        target: 'map',
        layers: [
            new ol.layer.Tile({
                source: new ol.source.OSM()
            })
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([-7.1, 31.9]),
            zoom: 6
        })
    });

   function updateMap(locations) {
    locations.forEach(function(location) {
        var coords = ol.proj.fromLonLat([location.lng, location.lat]);
        var marker = new ol.Feature({
            geometry: new ol.geom.Point(coords),
            name: location.name
        });

        // Définir l'image du marqueur avec une taille personnalisée
        var iconStyle = new ol.style.Style({
            image: new ol.style.Icon({
                anchor: [0.5, 1], // Position de l'ancre de l'icône
                src: '../images/marker.png', // Chemin vers votre image de marqueur
                scale: 0.1 // Ajustez cette valeur pour redimensionner l'icône
            })
        });
        marker.setStyle(iconStyle);
        var vectorSource = new ol.source.Vector({
            features: [marker]
        });

        var markerLayer = new ol.layer.Vector({
            source: vectorSource
        });

        // Ajout du marqueur à la carte
        map.addLayer(markerLayer);

        // Centrage de la carte sur la position du lieu
        map.getView().setCenter(coords);
        map.getView().setZoom(12); // Zoomer sur la localisation
    });
}



</script>
</body>
</html>
