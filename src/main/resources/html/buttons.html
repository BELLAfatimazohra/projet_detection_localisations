<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Style général des boutons */
        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white; /* Texte en blanc */
        }

        /* Bouton Restaurants */
        #restaurantsButton {
            background-color: #3498db; /* Bleu clair */
        }
        #restaurantsButton:hover {
            background-color: #2980b9; /* Bleu plus foncé au survol */
        }

        /* Bouton Pharmacies */
        #pharmaciesButton {
            background-color: #27ae60; /* Vert clair */
        }
        #pharmaciesButton:hover {
            background-color: #1e8449; /* Vert plus foncé au survol */
        }

        /* Bouton Hôtels */
        #hotelsButton {
            background-color: #e74c3c; /* Rouge clair */
        }
        #hotelsButton:hover {
            background-color: #c0392b; /* Rouge plus foncé au survol */
        }
    </style>

</head>
<body>
<button id="restaurantsButton">
    <i class="fas fa-utensils"></i> Restaurants
</button>
<button id="pharmaciesButton">
    <i class="fas fa-pills"></i> Pharmacies
</button>
<button id="hotelsButton">
    <i class="fas fa-bed"></i> Hôtels
</button>

<script>
    document.getElementById('restaurantsButton').onclick = function() {
      buttonActions.showRestaurants();  // Appel de la méthode Java
  };

  document.getElementById('pharmaciesButton').onclick = function() {
      buttonActions.showPharmacies();  // Appel de la méthode Java
  };

  document.getElementById('hotelsButton').onclick = function() {
      buttonActions.showHotels();  // Appel de la méthode Java
  };


</script>
</body>
</html>
